; 保留音のクラス定義 (2026-09-25)。
; ⚠同梱の musiconhold.conf をこのファイルで置き換えている (docker-compose.yml のマウント)。
;   使うのは fragment-ringback だけ。default は Asterisk の既定動作のために残す

[default]
mode=files
directory=moh

; 相手に聞かせる呼び出し音。録音告知の後、本人かAIが出るまでループで流す。
; 音は infra/scripts/render_ringback.py で作る (12音の自作の旋律、約3.4秒)
[fragment-ringback]
mode=files
directory=/var/lib/asterisk/moh-fragment
