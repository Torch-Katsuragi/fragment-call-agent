; manager.conf — AMI (Asterisk Manager Interface)。hookd の発信 (/dial → Originate) 用。
; ローカル専用: ACLで 127.0.0.1 と Docker ブリッジ (hookd) 以外を拒否する。
; GCP常駐化の際は secret を .env 化して見直すこと。

[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0
displayconnects = no

[callagent]
secret = callagent-local
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.255
permit = 172.16.0.0/255.240.0.0
read = call
write = call,originate
writetimeout = 5000
