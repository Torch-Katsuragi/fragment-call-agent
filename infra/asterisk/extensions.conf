; extensions.conf — M1 検証用ダイヤルプラン
;
; 検証は2段階:
;   1) echo モード (現在有効): Asterisk 単体でエコー応答。REGISTER・RTP・NAT の切り分け用
;   2) livekit モード: 音が通ったら [inbound-handler] の Echo ブロックを Dial 行に差し替え、
;      LiveKit SIP (127.0.0.1:5060 の inbound trunk) へブリッジする本来の M1 経路にする
;      ※LiveKit 側に inbound trunk + dispatch rule の作成が必要 (livekit/README 参照)

[general]
static=yes
writeprotect=yes

[globals]
; スタンバイ時に本人の受話を待つ秒数 (2026-08-01)。
; ⚠2.5秒を超えるとワンギリ (1コールで切って折り返させ通話料を押しつける手合い) が
;   抜けはじめる。伸ばすなら inbound-handler の注記にある対策ごと作り直すこと。
; ⚠hookd 側の STANDBY_RING_SEC と揃える (端末を鳴らす秒数がこれ)。
; 2026-09-18: 固定値 2 → 環境変数から読む (compose の asterisk と hookd の両方に列挙、既定 2)。
;   ユーザーが実機で「2秒は短い、8秒くらい」と判断したため .env で 8 にしてある。
;   ⚠2.5秒を超えるとワンギリ (1コールで切って折り返させる手合い) がAI応答前に抜ける。
;     被害が出るのは**人が折り返したとき**なので、管制室の履歴から折り返す前に
;     /screen の判定 (国際・プレミアム番号) を見る運用でカバーする。AIは折り返さない
; ⚠**globals では ${ENV(...)} が評価されない** (2026-09-18 に実測: `dialplan show globals` で空になり、
;   スタンバイが 0 秒で AI へ渡っていた)。値は standby ラベルの Set で実行時に読む (PHSEC と同じ流儀)。
;   ここには置かない — 置くと「設定したつもり」になる
; スタンバイの CURL タイムアウト (秒、CURLOPT(httptimeout))。必ず鳴動秒数より長く。想定上限 (15) より十分長い固定値
STANDBY_CURL_SEC=20

[from-brastel]
; ブラステルからの INVITE は宛先表記が揺れる可能性があるため catch-all で受ける。
; INEXTEN に元の宛先 (INVITEのTo) を退避してから inbound-handler へ渡す —
; 警備の関門 (/guard) が「着信なのに宛先が国際番号 = 中継の踏み台狙い」を見るのに使う
exten => s,1,Set(INEXTEN=${EXTEN})
 same => n,Goto(inbound-handler,s,1)
exten => _[+0-9a-zA-Z*#]!,1,Set(INEXTEN=${EXTEN})
 same => n,Goto(inbound-handler,s,1)

[from-twilio]
; Twilio Origination からの着信もブラステルと同じ着信ハンドラを共有 (2026-07-21)
exten => s,1,Set(INEXTEN=${EXTEN})
 same => n,Goto(inbound-handler,s,1)
exten => _[+0-9a-zA-Z*#]!,1,Set(INEXTEN=${EXTEN})
 same => n,Goto(inbound-handler,s,1)

[inbound-handler]
exten => s,1,NoOp(Brastel inbound: CID=${CALLERID(num)} to=${INEXTEN})
 ; ⚠呼び出し音を日本のものにする (2026-07-31)。既定は country=us のままで、
 ; **アメリカの呼び出し音** (440+480Hz・2秒鳴って4秒休み) を日本の相手に流していた。
 ; 日本は 400+15Hz・1秒鳴って2秒休み — テンポも音色も別物で「不自然」と実機で指摘された。
 ; 定義はAsterisk同梱の indications.conf に最初からあるので、音源の用意は不要。
 ; ⚠indications.conf を丸ごと差し替えるのではなくチャネル単位で指定する
 ;   (同梱ファイルは全世界分の定義を持つので、マウントで上書きすると保守が増える)
 same => n,Set(CHANNEL(tonezone)=jp)
 same => n,Set(CURLOPT(conntimeout)=2)
 ; httptimeout = 応答を待つ上限 (libcurl の CURLOPT_TIMEOUT = 接続込みの全体の秒数)。
 ; hookd がハングしても2秒で空が返り、各段の fail-open に落ちる。
 ; ⚠2026-09-25まではここが dltimeout だった。Asterisk 20 の func_curl に無いオプションで
 ;   (ログに `acf_curlopt_write: Unrecognized option: dltimeout`)、時間切れが一切効いていなかった。
 ;   使えるキーは `core show function CURLOPT` で確かめる
 same => n,Set(CURLOPT(httptimeout)=2)
 ; SIP不正利用の関門 (2026-07-26のトールフラウド事故対策、hookd /guard → services/agent/security.py)。
 ; 呼び出し音より前・下調べ (Gemini課金) より前に判定する。内線番号の総当たり・国際中継・
 ; 同一発信者の連続着信をここで落とす。hookd停止時は空が返り通常どおりつながる (fail-open)
 same => n,Set(GUARD=${CURL(http://127.0.0.1:8790/guard?from=${CALLERID(num)}&to=${INEXTEN})})
 same => n,GotoIf($["${GUARD}" = "reject"]?guarded)
 ; 通話の録音 (2026-07-30)。挨拶で「この通話は録音されます」と告知しているのに
 ; 実際は文字起こしとJSONLしか残しておらず、告知と実態がズレていた。
 ; 音声が残っていれば、文字起こしが取りこぼした数字 (金額・日時・口頭で指定された別番号) を
 ; 後から耳で確認できる。⚠発信者番号はSIPのCALLERID由来なので文字起こしを経由しない
 ;   = 折り返し先の番号にSTTの誤りは乗らない (2026-07-30にユーザーの指摘で確認)。
 ; 関門を通過した後に置く — 拒否した呼まで録っても意味がない。
 ; ⚠古い録音の掃除は未実装。8kHzモノラルwavで約1MB/分なので放置すると溜まる
 ; ⚠混合録音だけでは「どちらが喋ったか」が判定できない (2026-07-31)。
 ;   相手の声をAIが拾わない件を調べたとき、発話が重なる場面で話者の推定が割れて
 ;   原因を切り分けられなかった。r()/t() でレグ別にも残す:
 ;     _rx = 相手の声 (Asteriskが受け取る側)  _tx = AIの声 (Asteriskが送る側)
 ;   これで「相手の声が届いていないのか」「届いているが小さすぎるのか」を音量で確定できる。
 ;   ⚠容量は3倍になる。掃除が入るまでは調査用と割り切る
 same => n,Set(RECBASE=${STRFTIME(${EPOCH},Asia/Tokyo,%Y%m%d_%H%M%S)}_in_${CALLERID(num)}_${UNIQUEID})
 same => n,MixMonitor(${RECBASE}.wav,r(${RECBASE}_rx.wav)t(${RECBASE}_tx.wav))
 ; 着信を管制室と端末に通知 + 下調べと番号検索を起動 (caller_context / number_lookup ジョブ)。
 ; 端末には相手を出すが、出るボタンと着信音は録音告知の後 (hookd の phase=announcing)。
 ; hookd が落ちていても CURL は空を返すだけで呼の処理は続行する
 same => n,Set(RING=${CURL(http://127.0.0.1:8790/ringing_start?number=${CALLERID(num)})})
 same => n,Set(PREFETCH=${CURL(http://127.0.0.1:8790/prefetch?number=${CALLERID(num)})})
 ; --- 録音告知 (2026-09-25) ---
 ; 先に取って「この通話は録音されます」を流す。告知の間に下調べと番号検索が進む。
 ; ⚠取った時点で呼が成立して発信者に課金される = **ワンギリ対策がここで済む**。
 ;   以前はこれを「不在ならノータイムでAIが出る」で担っていたので、スタンバイの鳴動を
 ;   2.5秒より伸ばせなかった (伸ばすとワンギリが抜ける)。今は伸ばしてよい
 ; ⚠以前はAIの挨拶が録音告知を兼ねていた。本人が出る経路では告知が流れていなかった
 ; 音声は infra/asterisk/sounds/ (infra/scripts/render_prompts.py で作る。声は Chirp3-HD-Leda)
 same => n,Answer()
 same => n,Wait(0.3)
 same => n,Playback(fragment/rec-notice)
 ; 番号スクリーニング: web検索の判定が明白な営業/詐欺なら、ここで切る (自動ミュート)。
 ; 判定不明・検索未完了は ok が返り通常どおり進む (fail-open)。
 ; 告知の約2秒ぶん検索が先に進むので、以前は素通しだった初回の着信でも間に合うことがある
 same => n,Set(SCREEN=${CURL(http://127.0.0.1:8790/screen?number=${CALLERID(num)})})
 same => n,GotoIf($["${SCREEN}" = "reject"]?screened)
 ; ここから端末に出るボタンと着信音を出す。相手には呼び出し音を聞かせる
 ; (取った後なので Ringing() の信号は使えない — 音そのものを流す)。
 ; 呼び出し音は日本の標準音ではなく12音の自作の旋律 (2026-09-25、待ってもらいやすい方を選んだ)。
 ; 保留音の仕組み (musiconhold.conf の fragment-ringback) でループさせる —
 ; StartMusicOnHold は裏で鳴り続けるので、下の CURL で待っている間も途切れない
 same => n,Set(PH=${CURL(http://127.0.0.1:8790/ringing_phase?number=${CALLERID(num)})})
 same => n,StartMusicOnHold(fragment-ringback)
 ; --- ソフトフォン内線を先に鳴らす (2026-09-17) ---
 ; 「当面はただのIP電話、時期が来ればAI応対」を1本の経路で両立させるための段。
 ; PHONES_RING_SEC 秒だけ内線を同時に鳴らし、誰も出なければ**そのまま下の応答モードへ落ちる**。
 ;   PHONES_RING_SEC=20 + 応答モード manual → 内線だけが鳴る = ただのIP電話
 ;   PHONES_RING_SEC=5  + 応答モード standby → 5秒鳴って出なければAIが出る
 ; ⚠切り替えに再起動は要らない (応答モードは管制室のトグル)。デモの締めでその場で倒せる。
 ; ⚠0 か未設定なら丸ごと素通しするので、内線を作る前の挙動と完全に同じ。
 ; ⚠ENV() は asterisk コンテナの環境変数を読む。docker-compose.yml の environment に載せてある
 same => n,Set(PHSEC=${ENV(PHONES_RING_SEC)})
 same => n,ExecIf($["${PHSEC}" = ""]?Set(PHSEC=0))
 same => n,GotoIf($[${PHSEC} < 1]?nophones)
 same => n,Dial(PJSIP/1001&PJSIP/1002&PJSIP/1003,${PHSEC},m(fragment-ringback))
 ; 出たらそこで終わり。出なければ DIALSTATUS は NOANSWER/CHANUNAVAIL 等で下へ落ちる
 same => n,ExecIf($["${DIALSTATUS}" = "ANSWER"]?Hangup())
 same => n(nophones),NoOp(no extension answered: DIALSTATUS=${DIALSTATUS})
 ; ⚠内線の Dial が終わると呼び出し音も止まるので張り直す
 same => n,StartMusicOnHold(fragment-ringback)
 ; 応答モード (2026-08-01に2状態→3状態。管制室/アプリで切替 → settings テーブル)。
 ;   away    不在      … ノータイムでAIが出る (下の既定経路)
 ;   standby スタンバイ … 2秒だけ本人の受話を待ち、出なければAIに渡す
 ;   manual  自分で出る … AIは出ない。受話ボタン待ちで鳴らし続ける
 ; ⚠「スタンバイかどうか」は**本人の明示操作**であって、アプリやブラウザの
 ;   起動状態から推測してはいけない (推測すると、見ていないのに鳴り続ける)。
 ; hookd 停止時は空が返り away 扱い (fail-open = 従来どおりAIが出る)
 same => n,Set(AMODE=${CURL(http://127.0.0.1:8790/answer_mode)})
 same => n,GotoIf($["${AMODE}" = "manual"]?unattended)
 same => n,GotoIf($["${AMODE}" = "standby"]?standby)
 ; ⚠留守電ON(AI応答)のときは**ノータイムで出る** (2026-07-30に方針変更)。
 ; 以前は3コール分(9秒)待って本人が先に出る猶予と下調べの時間を稼いでいたが、
 ; 「1コールで切って折り返させ、通話料を相手に押し付ける」手合いが多いため即答に変えた。
 ; 即出れば呼が成立して発信者に課金されるので、この手のワンギリが無意味になる。
 ; そもそも留守電ON = AIに任せる意思表示なので、本人が先に出る猶予は不要
 ; (本人が出るなら留守電OFFにして下の unattended = 受話ボタン待ちの経路を使う)。
 ;
 ; ⚠番号スクリーニングは録音告知の直後 (上) に移した (2026-09-25)。以前はここで
 ;   AIにつなぐ直前に判定していたが、ノータイム応答では検索が間に合わず初回は素通しだった
 ; ⚠つながるまでの数秒 (LiveKit への接続とAIの入室) も同じ呼び出し音で埋める (Dial の m)
 same => n(aidial),StopMusicOnHold()
 same => n,Dial(PJSIP/call-agent@livekit,30,m(fragment-ringback))   ; ← 2) LiveKit ブリッジ (M1 後半。2026-07-15 切替、エコー検証は通過済み)
 same => n,Hangup()
 same => n(screened),NoOp(number screened as sales/scam — auto reject)
 same => n,Hangup()
 ; --- スタンバイ: 本人が「今は自分で出られる」と明示している状態。
 ;     STANDBY_RING_SEC だけ端末を鳴らし、出なければそのままAIに渡す。
 ;     ⚠ここでは Wait を使わない。2秒間隔のポーリングだと猶予をまるごと取りこぼすので、
 ;       押された瞬間に返るロングポーリング (/pickup_wait) で待つ。
 ;     ⚠CURLOPT(httptimeout) を伸ばしてから叩くこと。上で2秒に絞ってあるため、
 ;       そのままだと必ず時間切れになり受話が届かない
 ; ⚠鳴動秒数は環境変数 STANDBY_RING_SEC (compose で asterisk と hookd の両方に渡す)。
 ;   globals では ENV() が効かないので**ここで**読む。空なら 2 (hookd の既定と同じ)
 same => n(standby),Set(RSEC=${ENV(STANDBY_RING_SEC)})
 same => n,ExecIf($["${RSEC}" = ""]?Set(RSEC=2))
 same => n,NoOp(standby: wait ${RSEC}s for owner pickup)
 same => n,Set(CURLOPT(httptimeout)=${STANDBY_CURL_SEC})
 same => n,Set(PICKUP=${CURL(http://127.0.0.1:8790/pickup_wait?number=${CALLERID(num)}&timeout=${RSEC})})
 same => n,Set(CURLOPT(httptimeout)=2)
 same => n,GotoIf($["${PICKUP}" = "yes"]?bridge)
 ; 端末の「切る」= 相手ごと切る / 「AIに任せる」= 待たずに AI (2026-09-25、hookd /ringing_decide)
 same => n,GotoIf($["${PICKUP}" = "reject"]?rejected)
 same => n,GotoIf($["${PICKUP}" = "ai"]?aidial)
 ; 出なかった → 不在と同じ経路でAIに渡す
 same => n,Goto(aidial)
 ; --- 端末で「切る」: 相手ごと切る (AI にも回さない)
 same => n(rejected),NoOp(owner rejected on device: ${CALLERID(num)})
 same => n,StopMusicOnHold()
 same => n,Hangup(21)
 ; --- 警備の関門で拒否: 呼び出し音も鳴らさず即座に切る (403相当)。
 ;     記録は security_events に残り、管制室のバナーとWebhookで通知される
 same => n(guarded),NoOp(security guard rejected: from=${CALLERID(num)} to=${INEXTEN})
 same => n,Hangup(21)
 ; --- 留守電OFF: AIは出ない。管制室の受話ボタンを2秒おきに確認しながら40秒余り鳴らす。
 ;     受話されたら LiveKit へブリッジ (agent は書記モード = 文字起こし+吹き出しのみ、無言)
 same => n(unattended),NoOp(assistant off: ring until dashboard pickup)
 ; ⚠2026-08-01: Wait(2)+/pickup のポーリングから /pickup_wait のロングポーリングに変更。
 ;   端末の受話ボタンを押してから最大2秒待たされていたのを、押した瞬間に返るようにした。
 ;   細切れに呼び直すのは CURL の時間切れと「相手が先に切った」の検知を効かせるため。
;   httptimeout (8) は pickup_wait の timeout (4) より長くしておく — 短いと受話しても no になる
 same => n,Set(TRIES=0)
 same => n(pickloop),Set(CURLOPT(httptimeout)=8)
 same => n,Set(PICKUP=${CURL(http://127.0.0.1:8790/pickup_wait?number=${CALLERID(num)}&timeout=4)})
 same => n,Set(CURLOPT(httptimeout)=2)
 same => n,GotoIf($["${PICKUP}" = "yes"]?bridge)
 ; 端末の「切る」= 相手ごと切る / 「AIに任せる」= 待たずに AI (2026-09-25、hookd /ringing_decide)
 same => n,GotoIf($["${PICKUP}" = "reject"]?rejected)
 same => n,GotoIf($["${PICKUP}" = "ai"]?aidial)
 same => n,Set(TRIES=$[${TRIES} + 1])
 same => n,GotoIf($[${TRIES} > 10]?giveup)
 same => n,Goto(pickloop)
 same => n(giveup),Hangup()
 same => n(bridge),NoOp(dashboard pickup: bridging as scribe)
 same => n,StopMusicOnHold()
 same => n,Dial(PJSIP/call-agent@livekit,30,m(fragment-ringback))
 same => n,Hangup()
; 切断の通知 (2026-07-30追加)。これが無いと管制室の着信バナーが最大60秒残り続ける
; (hookd の _prune は保険であって実態の反映ではない)。h は同一コンテキストの全経路で走る
exten => h,1,NoOp(inbound hangup: ${CALLERID(num)})
 same => n,Set(CURLOPT(conntimeout)=2)
 same => n,Set(CURLOPT(httptimeout)=2)
 same => n,Set(END=${CURL(http://127.0.0.1:8790/call_ended?number=${CALLERID(num)})})
; --- 1) Asterisk 単体エコーに戻す場合は Dial を消してこちらを有効化 (RTP/NAT の切り分け用) ---
; same => n,Answer()
; same => n,Wait(0.5)
; same => n,Playtones(1000/300)             ; beep音声ファイル不在のため組込トーン生成 (2026-07-15)
; same => n,Wait(0.5)
; same => n,StopPlaytones()
; same => n,Echo()
; same => n,Hangup()

[phones]
; ソフトフォン内線からの発信 (2026-09-17)。PC親機1001 / スマホ子機1002,1003。
; ⚠この context に置けるのは **Tailscale 経由で REGISTER した端末だけ** (pjsip側の注記参照)。
;
; ⚠⚠**緊急通報は使えない**。ブラステルMy050は050番号なので110/119/118に繋がらない。
;   黙って失敗させると「かけたつもり」が生まれて危ないので、明示的に落として記録する。
;   事業所に入れるときは、緊急通報用の回線 (既存の電話機 or 携帯) を必ず別に残すこと。
exten => _11[089],1,NoOp(EMERGENCY DIAL BLOCKED: ${CALLERID(num)} -> ${EXTEN} (050では発信不可))
 same => n,Hangup(21)

; --- 内線同士 ---
exten => _100X,1,NoOp(internal: ${CALLERID(num)} -> ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; --- 国際発信は落とす (トールフラウド対策) ---
; ⚠2026-07-26に踏んだ被害はこの型 (こちらを踏み台にして高額番号へ中継させる)。
;   着信側は hookd /guard が見ているが、**内線からの発信はそこを通らない**。
;   内線の認証情報が漏れても金銭被害にならない最後の防壁なので外さないこと。
;   00…=001/0033/0061等の事業者コード経由、010…=携帯からの国際、0990…=ダイヤルQ2
exten => _00.,1,NoOp(international blocked: ${CALLERID(num)} -> ${EXTEN})
 same => n,Hangup(21)
exten => _010.,1,NoOp(international blocked: ${CALLERID(num)} -> ${EXTEN})
 same => n,Hangup(21)
exten => _0990.,1,NoOp(premium blocked: ${CALLERID(num)} -> ${EXTEN})
 same => n,Hangup(21)

; --- 国内発信 (ブラステル経由) ---
; 0 のあとが 1-9 = 国内番号。上の 00/010/0990 のほうが具体的なので先に当たる
exten => _0Z.,1,NoOp(outbound: ${CALLERID(num)} -> ${EXTEN})
 ; ⚠CallerID を指定しないと From が "Anonymous" になり、ブラステルが非通知発信して
 ;   相手の非通知ブロックに弾かれる (2026-07-19に実測)。hookd の発信と同じ値を使う
 same => n,Set(CALLERID(num)=${ENV(OUTBOUND_CALLERID)})
 same => n,Dial(PJSIP/${EXTEN}@brastel,60)
 same => n,Hangup()

[from-livekit]
; LiveKit 側からの発信をブラステル経由で出す経路 (未使用 — 発信は AMI Originate 方式)
exten => _X!,1,NoOp(Outbound via Brastel: not implemented yet)
 same => n,Hangup()

[outbound-bridge]
; 発信 (2026-07-19): hookd /dial → AMI Originate(Channel=PJSIP/<相手番号>@brastel)。
; 相手が応答した瞬間にこの priority 1 から実行される。CALLERID(num) に相手番号を載せて
; LiveKit へブリッジ — ルーム名が着信と同じ call_<相手番号>_xxx になるので、
; 電話帳・下調べ・履歴・吹き出し支援が無改修でそのまま動く。
; agent は outbound_call の印 (hookd が /dial 時に DB へ置く) を見て書記モードで入る (本人が話す)
exten => s,1,NoOp(Outbound answered: OUTNUM=${OUTNUM})
 same => n,Set(CURLOPT(conntimeout)=2)
 same => n,Set(CURLOPT(httptimeout)=2)
 ; 録音は発信でも残す (in/out はファイル名で区別。詳細は inbound-handler の注記)
 same => n,MixMonitor(${STRFTIME(${EPOCH},Asia/Tokyo,%Y%m%d_%H%M%S)}_out_${OUTNUM}_${UNIQUEID}.wav)
 same => n,Set(ANS=${CURL(http://127.0.0.1:8790/outbound_answered?number=${OUTNUM})})
 same => n,Set(CALLERID(num)=${OUTNUM})
 same => n,Dial(PJSIP/call-agent@livekit,30)
 same => n,Hangup()
; 切断の通知 (2026-07-30追加)。これが無いと「発信中・接続中…」バナーが通話終了後も
; 最大180秒 (_prune_dialing の保険期間) 出っぱなしになる。実際に指摘を受けた症状
exten => h,1,NoOp(outbound hangup: ${OUTNUM})
 same => n,Set(CURLOPT(conntimeout)=2)
 same => n,Set(CURLOPT(httptimeout)=2)
 same => n,Set(END=${CURL(http://127.0.0.1:8790/call_ended?number=${OUTNUM})})
